  :root {

  }
  html, body { height: 100%; }
  body { background: var(--tinta); color: var(--papel); font-family: var(--body); font-size: 16px; line-height: 1.45;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  header span { font-size: 13px; color: var(--muted); white-space: nowrap; }

  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 22px; overflow: hidden; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(22,19,31,.35); border: 0; cursor: pointer; }
  .start span { display: inline-flex; align-items: center; gap: 10px; padding: 16px 26px; border-radius: 999px; background: var(--volt); color: var(--tinta); font: 800 19px var(--display); }
  .tap { position: absolute; inset: 0; background: transparent; border: 0; cursor: pointer; }

  .quiz { padding: 16px; border-radius: 20px; background: var(--tinta-2); border: 2px solid var(--tinta-3); display: flex; flex-direction: column; gap: 10px; }

  section h2 { margin: 6px 0 8px; font: 800 13px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .cues { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 4px; }
  .cue { display: grid; grid-template-columns: 74px 1fr; gap: 10px; text-align: left; padding: 9px 10px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); font: inherit; cursor: pointer; }

const $ = (id) => document.getElementById(id);
const v = $("v");
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const marked = (s) => esc(s).replace(/\{([^}]*)\}/g, (_, x) => `<mark>${x}</mark>`);
const norm = (s) => s.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z' ]/g, " ").replace(/\s+/g, " ").trim();
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const PLAY = '<path d="M6 4l14 8-14 8z" fill="currentColor"/>';
const PAUSE = '<rect x="5" y="4" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="currentColor"/>';

const cps = TIMES.checkpoints.map((t) => ({ ...t, ...AULA.checkpoints.find((c) => c.id === t.id), result: null }));
const lines = Object.fromEntries(AULA.lines.map((l) => [l.id, l]));

// Marcadores das pausas na barra.
for (const c of cps) {

}

// Legenda interativa: toque numa fala para ir até ela.
const cueEls = TIMES.cues.map((c) => {

  const b = document.createElement("button");
  b.className = "cue";
  const who = AULA.speakers[l.speaker].name;
  b.innerHTML = `<span class="who">${who}</span><span>${l.lang === "en" ? `<span class="en">${esc(l.text)}</span><span class="tr">${esc(l.pt || "")}</span>` : marked(l.text)}</span>`;
  b.onclick = () => { if (quizOpen) return; v.currentTime = c.start + 0.01; lastT = v.currentTime; play(); };
  $("cues").appendChild(b);
  return { ...c, el: b };
});

let started = false, quizOpen = false, lastT = 0;
function play() { v.play().catch(() => {}); }
function setPP() { $("pp-i").innerHTML = v.paused ? PLAY : PAUSE; $("pp").setAttribute("aria-label", v.paused ? "Continuar" : "Pausar"); }
v.addEventListener("play", setPP); v.addEventListener("pause", setPP); setPP();

$("start").onclick = () => { started = true; $("start").hidden = true; $("tap").hidden = false; play(); };
$("tap").onclick = $("pp").onclick = () => { if (quizOpen) return; if (!started) return $("start").click(); v.paused ? play() : v.pause(); };
v.addEventListener("ended", () => { $("tap").hidden = true; });

// Laço de quadros: pausa exata no ponto de cada pergunta (timeupdate é lento demais).
function tick() {
  const t = v.currentTime;
  if (!v.paused && !quizOpen) {
    const cp = cps.find((c) => c.result === null && lastT < c.at && t >= c.at - 0.04);
    if (cp) { v.pause(); v.currentTime = cp.at; openQuiz(cp); }
  }
  lastT = t;
  $("fill").style.width = `${(t / TIMES.duration) * 100}%`;
  $("clock").textContent = fmt(t);
  const cur = cueEls.findLast((c) => t >= c.start - 0.05);
  for (const c of cueEls) c.el.classList.toggle("now", c === cur && t <= c.end + 0.6);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

let dictation = null;
(async () => { try { dictation = await window.claude?.use?.("dictation"); } catch { dictation = null; } })();

const feedbackAudio = new Audio();
function openQuiz(cp) {
  quizOpen = true;
  $("tap").hidden = true;
  const q = $("quiz");
  const canSpeak = !!dictation;
  q.innerHTML = `<span class="eyebrow">${cp.mode === "speak" ? "Sua vez · fale" : "Sua vez"}</span>

  q.scrollIntoView({ block: "nearest", behavior: "smooth" });

  const mic = q.querySelector("#mic");
  if (mic) mic.onclick = () => listen(cp, mic);
}

function listen(cp, mic) {
  const msg = $("mic-msg");
  let heard = "";
  const unsub = [];

  if (mic.classList.contains("on")) { dictation.stop().catch(() => {}); return; }
  // start() precisa sair direto do toque, sem nada esperado antes.
  dictation.start({ language: "en-US" }).catch((e) => {
    mic.classList.remove("on");
    msg.textContent = e?.code === "not_granted" ? "Sem permissão do microfone. Toque na resposta." : "Não deu para ouvir. Tente de novo ou toque na resposta.";

  });
  mic.classList.add("on");
  msg.textContent = "Ouvindo…";
  // Para sozinho 1,2 s depois da última frase ouvida (o aluno não precisa tocar de novo).
  let quiet = null;
  const settle = () => { clearTimeout(quiet); quiet = setTimeout(() => dictation.stop().catch(() => {}), 1200); };
  const cap = setTimeout(() => dictation.stop().catch(() => {}), 8000);
  unsub.push(() => { clearTimeout(quiet); clearTimeout(cap); });
  unsub.push(dictation.onPartial(({ text }) => { clearTimeout(quiet); msg.innerHTML = `<span class="heard">${esc(text)}</span>`; }));
  unsub.push(dictation.onFinal(({ text }) => { heard = `${heard} ${text}`.trim(); msg.innerHTML = `<span class="heard">${esc(heard)}</span>`; settle(); }));
  unsub.push(dictation.onState(({ state }) => {
    if (state !== "idle") return;
    mic.classList.remove("on");
    stopAll();
    if (!heard) { msg.textContent = "Não ouvi nada. Tente de novo ou toque na resposta."; return; }
    const n = norm(heard);
    const ok = cp.speak.some((p) => n.includes(norm(p)));
    answer(cp, ok, null, heard);
  }));
}

function answer(cp, ok, chosen, heard) {
  if (cp.result !== null) return;
  cp.result = ok;
  cp.mark.classList.add("done");
  const q = $("quiz");
  q.querySelectorAll(".opt").forEach((b) => {
    b.disabled = true;
    if (b.dataset.o === cp.answer) b.classList.add("ok");
    else if (b.dataset.o === chosen) b.classList.add("no");
  });
  q.querySelector(".mic-row")?.remove();
  const fb = cp.feedback[ok ? "ok" : "no"];
  const box = document.createElement("div");
  box.className = `fb ${ok ? "ok" : "no"}`;
  box.innerHTML = `${heard ? `Você disse: "${esc(heard)}". ` : ""}${marked(fb.text)}`;
  const go = document.createElement("button");
  go.className = "btn";
  go.textContent = "Continuar a aula";
  go.onclick = resume;
  q.append(box, go);
  go.focus({ preventScroll: true });
  feedbackAudio.src = `audio/${fb.id}.mp3`;
  feedbackAudio.play().catch(() => {});
  feedbackAudio.onended = () => setTimeout(() => { if (quizOpen && cp.result !== null) resume(); }, 900);
  renderScore();
}

function resume() {
  if (!quizOpen) return;
  feedbackAudio.pause();
  quizOpen = false;
  $("quiz").hidden = true;
  $("tap").hidden = false;
  lastT = v.currentTime;
  play();
}

function renderScore() {
  const done = cps.filter((c) => c.result !== null);
  $("score").innerHTML = done.length
    ? cps.map((c, i) => `<span class="${c.result === null ? "" : c.result ? "ok" : "no"}">Pergunta ${i + 1}: ${c.result === null ? "a fazer" : c.result ? "acertou" : "corrigida"}</span>`).join("")
    : "";
}
</script>
