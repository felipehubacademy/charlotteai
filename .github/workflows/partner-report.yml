name: Partner Report

on:
  # Envio só manual (Actions > Partner Report > Run workflow). Precisa do segredo CRON_SECRET no GitHub
  # com o mesmo valor do CRON_SECRET da Vercel.
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send monthly partner report
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://charlotte.hubacademybr.com/api/cron/partner-report"
