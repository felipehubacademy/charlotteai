name: "Fila de e-mails (reenvio)"

on:
  schedule:
    # A cada 5 minutos: reenvia os e-mails que falharam (lib/email-outbox).
    - cron: '*/5 * * * *'
  workflow_dispatch: # permite rodar manualmente

jobs:
  outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call email outbox
        run: |
          response=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: github-actions-cron" \
            -d '{}' \
            "https://queizy.com/api/cron/email-outbox")
          echo "Response status: $response"
          cat /tmp/out.json | head -c 2000
          if [ "$response" != "200" ]; then exit 1; fi
