# .github/workflows/ota-update.yml
# Publica OTA da branch main em lote: 2 vezes por dia (12h e 22h de Brasília), só se apps/mobile mudou
# desde a última publicada. Cada OTA faz o aparelho baixar o pacote inteiro de novo (~6 MB); publicar a
# cada push (7+ por dia) fazia o download recomeçar sem parar e muita gente nunca saía do código da loja
# (2026-10-21). Correção urgente: rodar na hora com `gh workflow run ota-update.yml` (Actions > Run workflow).
# IMPORTANTE: deve rodar em macos-latest para que o hermesc (compilador
# Hermes) produza bytecode compativel com o binario iOS gerado pelo EAS.
# Linux hermesc gera formato diferente e causa crash no app.

name: OTA Update (production)

on:
  schedule:
    - cron: '0 15 * * *'   # 12h de Brasília
    - cron: '0 1 * * *'    # 22h de Brasília
  workflow_dispatch:

# Um OTA por vez: dois pushes seguidos publicavam em paralelo e o mais antigo, terminando por
# último, virava o "mais recente" (o app perdia a correção do push mais novo). Na fila, a execução
# pendente mais nova substitui a anterior, então o último publicado é sempre o último commit.
concurrency:
  group: ota-production
  cancel-in-progress: false

jobs:
  update:
    name: Publish EAS OTA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      # A mensagem de cada OTA leva o commit ("OTA [abc1234]: ..."); sem mudança em apps/mobile desde ele, não publica.
      - name: Check for app changes since last OTA
        id: changes
        run: |
          LAST=$(eas update:list --branch production --limit 1 --json --non-interactive 2>/dev/null \
            | python3 -c "import json,sys,re; d=json.load(sys.stdin); g=d.get('currentPage', d); m=re.search(r'OTA \[([0-9a-f]{7,40})\]', (g[0].get('message') or '') if g else ''); print(m.group(1) if m else '')" || true)
          echo "Última OTA: ${LAST:-desconhecida}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$LAST" ] && git cat-file -e "$LAST^{commit}" 2>/dev/null \
             && git diff --quiet "$LAST" HEAD -- . ; then
            echo "Nada mudou em apps/mobile desde a última OTA."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            N=$( [ -n "$LAST" ] && git cat-file -e "$LAST^{commit}" 2>/dev/null && git rev-list --count "$LAST"..HEAD -- . || echo 1)
            SUBJ=$(git log -1 --format=%s -- . | cut -c1-80)
            echo "msg=OTA [$(git rev-parse --short=7 HEAD)]: ${N} mudança(s), última: ${SUBJ}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish OTA (iOS)
        if: steps.changes.outputs.publish == 'true'
        env:
          EXPO_PUBLIC_API_BASE_URL: https://charlotte.hubacademybr.com
          EXPO_PUBLIC_SUPABASE_URL: https://fnvjibzreepubageztoi.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZudmppYnpyZWVwdWJhZ2V6dG9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgzNTYyNTgsImV4cCI6MjA2MzkzMjI1OH0.lm1h39VOgl-VwxnpGEFkvFrNRGIEeA1sQFI7xTJTsnw
          # Sentry — sobe sourcemaps do bundle OTA pro painel. Sem isso,
          # cada OTA gera nova release no Sentry mas com stack traces
          # minificados. Token gerenciado em GitHub Secrets.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: hub-academy
          SENTRY_PROJECT: charlotte-mobile
          MSG: ${{ steps.changes.outputs.msg }}
        run: |
          CI=1 eas update \
            --branch production \
            --platform ios \
            --message "$MSG"
          CI=1 eas update \
            --branch production \
            --platform android \
            --message "$MSG"
