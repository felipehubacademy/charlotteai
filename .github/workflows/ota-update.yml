# .github/workflows/ota-update.yml
# Publica OTA automaticamente a cada push na branch main.
# IMPORTANTE: deve rodar em macos-latest para que o hermesc (compilador
# Hermes) produza bytecode compativel com o binario iOS gerado pelo EAS.
# Linux hermesc gera formato diferente e causa crash no app.

name: OTA Update (production)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'

jobs:
  update:
    name: Publish EAS OTA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Publish OTA (iOS)
        env:
          EXPO_PUBLIC_API_BASE_URL: https://charlotte.hubacademybr.com
          EXPO_PUBLIC_SUPABASE_URL: https://fnvjibzreepubageztoi.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZudmppYnpyZWVwdWJhZ2V6dG9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgzNTYyNTgsImV4cCI6MjA2MzkzMjI1OH0.lm1h39VOgl-VwxnpGEFkvFrNRGIEeA1sQFI7xTJTsnw
          # Sentry — sobe sourcemaps do bundle OTA pro painel. Sem isso,
          # cada OTA gera nova release no Sentry mas com stack traces
          # minificados. Token gerenciado em GitHub Secrets.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: hub-academy
          SENTRY_PROJECT: charlotte-mobile
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG=$(printf '%s' "$COMMIT_MSG" | head -n 1 | cut -c1-100)
          CI=1 eas update \
            --branch production \
            --platform ios \
            --message "OTA: $MSG"
          CI=1 eas update \
            --branch production \
            --platform android \
            --message "OTA: $MSG"
