name: Limpeza dos áudios do Free Chat

on:
  schedule:
    # Todo dia, 07:00 UTC (04:00 em Brasília): apaga áudios com mais de 90 dias (fica a transcrição)
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove old chat audio
        run: |
          curl -sS --fail-with-body -H "Authorization: Bearer ${{ secrets.CRON_SECRET_TOKEN }}" \
            "https://charlotte.hubacademybr.com/api/cron/chat-audio-cleanup"
