<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Bricolage"; font-weight: 800; src: url("../../../apps/mobile/assets/fonts/BricolageGrotesque96pt-ExtraBold.ttf"); }
  html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: #FAF7F0; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #bg { position: absolute; inset: 0; }
  #circle { position: absolute; width: 640px; height: 640px; border-radius: 50%; background: #DCFF4A; left: 40px; top: 190px; }
  #ch { position: absolute; left: -40px; top: 20px; width: 800px; height: 1600px; }
  #ch svg { width: 100%; height: 100%; }
  #logo { position: absolute; left: 40px; top: 44px; height: 34px; }
  #sub { position: absolute; left: 40px; right: 40px; bottom: 70px; padding: 22px 26px; border-radius: 26px; background: #16131F; color: #FAF7F0;
         font: 600 30px/1.3 system-ui, sans-serif; }
  #sub b { display: block; font: 800 20px Bricolage, sans-serif; color: #DCFF4A; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; }
</style></head>
<body>
<div id="stage">
  <div id="bg"><div id="circle"></div></div>
  <div id="ch"></div>
  <img id="logo" src="../../../branding/logo/queizy-logo-preto.svg">
  <div id="sub"><b>Charlotte</b><span id="subtxt"></span></div>
</div>
<script src="charlotte.js"></script>
<script>
  const ch = document.getElementById("ch");
  ch.innerHTML = Charlotte.svg();
  let D = { env: [], fps: 30, voiceAt: 0.5, text: "" };
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const ease = (x) => { x = clamp(x); return x < .5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2; }; // quart in-out
  const span = (t, a, b) => ease((t - a) / (b - a));
  const mix = (a, b, k) => a + (b - a) * k;
  function env(t) { // abertura da boca (0..1) a partir da voz, suavizada
    const i = (t - D.voiceAt) * D.fps; if (i < 0 || i >= D.env.length - 1) return 0;
    const k = i - Math.floor(i); return mix(D.env[Math.floor(i)], D.env[Math.floor(i) + 1], k);
  }
  function smooth(t, w = 0.35) { let s = 0, n = 0; for (let d = -w; d <= w; d += 1 / 30) { s += env(t + d); n++; } return s / n; }
  function blink(t) {
    for (const b of [1.25, 3.05, 4.95, 6.7]) { const d = t - b; if (d >= 0 && d < .07) return d / .07; if (d >= .07 && d < .17) return 1 - (d - .07) / .1; }
    return 0;
  }
  window.setup = (d) => { D = { ...D, ...d }; document.getElementById("subtxt").textContent = D.text; };
  window.seek = (t) => {
    // câmera: aproximação lenta e contínua
    const z = 1 + 0.05 * clamp(t / 7.3);
    document.getElementById("stage").style.transform = `scale(${z})`;
    document.getElementById("stage").style.transformOrigin = "50% 38%";
    document.getElementById("bg").style.transform = `translateY(${-6 * clamp(t / 7.3)}px)`;
    // entrada: opacidade e deslize curto, sem elástico
    const ein = span(t, 0, .6);
    ch.style.opacity = ein; ch.style.transform = `translateY(${(1 - ein) * 30}px)`;
    document.getElementById("sub").style.opacity = span(t, .3, .8);
    // aceno uma vez, no "Oi!"
    const up = span(t, .35, .95), down = span(t, 2.0, 2.6), raised = up * (1 - down);
    const wave = Math.sin(Math.max(0, t - .95) * Math.PI * 2 * 1.6) * 13 * clamp((t - .95) / .2) * (1 - span(t, 1.75, 2.0));
    const armR = { s: mix(-9, -142, raised), e: mix(6, -24, raised) + wave * raised, w: mix(0, -6, raised) };
    // mão aberta, apresentando, no "Hoje você vai aprender" e de novo no "Vem comigo!"
    const pres = span(t, 2.9, 3.5) * (1 - span(t, 4.8, 5.4)) + span(t, 5.6, 6.1) * (1 - span(t, 6.7, 7.2));
    const armL = { s: mix(9, 16, pres), e: mix(-6, 46, pres), w: mix(0, 18, pres) };
    const talk = env(t), avg = smooth(t);
    Charlotte.apply(ch, {
      armR, handR: raised > .3 ? "open" : "relax",
      armL, handL: pres > .3 ? "open" : "relax",
      mouth: talk, smile: 1,
      head: 2.2 * Math.sin(t * 1.1) * clamp(avg * 3) + mix(0, -3, raised) + mix(0, 2.5, pres),
      nod: 3 * avg,
      brow: clamp(smooth(t, .12) * 1.6 - .3) * .8 + .4 * raised,
      gaze: [0.15 * Math.sin(t * .7), 0],
      blink: blink(t),
      breathe: .5 + .5 * Math.sin(t * 2 * Math.PI / 3.6),
    });
  };
  window.seek(0);
</script>
</body></html>
