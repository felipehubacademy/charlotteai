<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Quadros de aprovação da aula PN01 "Oi!" (antes de gerar vozes e imagens). Estilo igual ao do piloto
     (scripts/aula-motion/novice-01/aula.html). Abra com #1, #2 ou #3. -->
<style>
  @font-face { font-family: "Bricolage"; font-weight: 700; src: url("../../../apps/mobile/assets/fonts/BricolageGrotesque96pt-Bold.ttf"); }
  @font-face { font-family: "Bricolage"; font-weight: 800; src: url("../../../apps/mobile/assets/fonts/BricolageGrotesque96pt-ExtraBold.ttf"); }
  :root { --volt: #DCFF4A; --tinta: #16131F; --pink: #FF4F8B; --papel: #FAF7F0; --violeta: #6B4BFF; --verde: #2BD97C; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--tinta); font-family: system-ui, sans-serif; }
  .layer { position: absolute; inset: 0; overflow: hidden; display: none; }
  .type { background: var(--tinta); }
  .blobs { position: absolute; inset: -100px; filter: blur(70px); opacity: .55; }
  .blobs i { position: absolute; border-radius: 50%; }
  .grain { position: absolute; inset: 0; opacity: .08; width: 1280px; height: 720px; }
  .c { position: absolute; left: 640px; transform: translateX(-50%); white-space: nowrap; }
  .lab { font: 600 28px system-ui, sans-serif; color: rgba(250,247,240,.62); }
  /* quadro 1: você já sabe inglês */
  #k-h { top: 92px; font: 800 30px Bricolage, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--volt); }
  #k-row { position: absolute; left: 0; right: 0; top: 190px; display: flex; justify-content: center; gap: 34px; }
  .card { width: 300px; height: 270px; border-radius: 34px; background: rgba(250,247,240,.07); border: 3px solid rgba(250,247,240,.16);
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  .card svg { width: 96px; height: 96px; }
  .card .e { font: 800 72px/1 Bricolage, sans-serif; color: var(--papel); letter-spacing: -.02em; }
  .card.on { background: var(--volt); border-color: var(--volt); }
  .card.on .e { color: var(--tinta); }
  .card.dim { opacity: .35; transform: translateY(26px); }
  #k-lab { top: 520px; font: 800 52px Bricolage, sans-serif; color: var(--papel); }
  #k-lab span { color: var(--volt); }
  /* quadro 2: hi e hello */
  #h-row { position: absolute; left: 0; right: 0; top: 120px; display: flex; justify-content: center; gap: 220px; }
  .wd { text-align: center; }
  .wd .e { position: relative; font: 800 168px/1 Bricolage, sans-serif; color: var(--papel); letter-spacing: -.03em; }
  .wd .e b { color: var(--volt); position: relative; }
  .wd .e svg { position: absolute; left: -78px; top: 20px; width: 80px; height: 90px; }
  .wd .p { font: 800 46px Bricolage, sans-serif; color: rgba(250,247,240,.75); margin-top: 16px; }
  .wd .p::before { content: "= "; color: rgba(250,247,240,.4); }
  #h-tip { top: 448px; display: flex; align-items: center; gap: 18px; padding: 18px 30px 20px; border-radius: 26px; background: rgba(250,247,240,.08); border: 2px solid rgba(220,255,74,.5); }
  #h-tip .t1 { font: 800 36px Bricolage, sans-serif; color: var(--papel); }
  #h-tip .t1 span { color: var(--volt); }
  #h-tip2 { top: 560px; font: 600 28px system-ui, sans-serif; color: rgba(250,247,240,.7); }
  #h-tip2 s { text-decoration: none; color: rgba(250,247,240,.45); }
  #h-tip2 strong { color: var(--papel); }
  /* quadro 3: pausa 1 na rua */
  .img { position: absolute; left: 0; top: 0; width: 1280px; height: 723px; transform-origin: 0 0; }
  .sun { position: absolute; inset: 0; mix-blend-mode: screen; background: radial-gradient(60% 70% at 78% 8%, rgba(255,214,140,.35), transparent 60%); }
  .vig { position: absolute; inset: 0; background: radial-gradient(120% 100% at 50% 45%, transparent 55%, rgba(22,19,31,.45)); }
  #q { position: absolute; left: 640px; bottom: 50px; width: 800px; transform: translateX(-50%); background: rgba(22,19,31,.93); border-radius: 30px; padding: 22px 26px 24px;
       color: var(--papel); box-shadow: 0 20px 50px rgba(0,0,0,.35); z-index: 20; }
  #q .h { font: 800 30px/1.2 Bricolage, sans-serif; }
  #q .opts { display: flex; gap: 12px; margin-top: 16px; }
  #q .o { flex: 1; display: flex; align-items: center; justify-content: center; padding: 14px 10px; border-radius: 18px; border: 2px solid rgba(250,247,240,.2); font: 700 28px Bricolage, sans-serif; }
  #turn { position: absolute; left: 60px; top: 56px; background: var(--pink); color: var(--tinta); font: 800 34px Bricolage, sans-serif; padding: 10px 22px 12px; border-radius: 16px; transform: rotate(-4deg); z-index: 20; }
  #narr { position: absolute; left: 34px; bottom: 30px; display: flex; align-items: center; gap: 12px; z-index: 20; }
  #narr .av { width: 58px; height: 58px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 3px var(--volt); background: #EDE7DD; }
  #narr .av img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; }
  #narr .n { font: 800 18px Bricolage, sans-serif; color: var(--papel); text-shadow: 0 1px 8px rgba(22,19,31,.5); }
  #narr .s { font: 500 14px system-ui, sans-serif; color: rgba(250,247,240,.75); text-shadow: 0 1px 8px rgba(22,19,31,.5); }
  #logo { position: absolute; right: 34px; top: 30px; height: 30px; z-index: 20; }
</style></head>
<body>
<div class="layer type" id="F1">
  <div class="blobs"><i style="width:520px;height:520px;background:#6B4BFF;left:-60px;top:-40px"></i><i style="width:420px;height:420px;background:#DCFF4A;right:-40px;bottom:-60px;opacity:.5"></i><i style="width:360px;height:360px;background:#FF4F8B;right:260px;top:-120px;opacity:.45"></i></div>
  <canvas class="grain" width="640" height="360"></canvas>
  <div class="c" id="k-h">Você já fala inglês</div>
  <div id="k-row">
    <div class="card on"><svg viewBox="0 0 96 96"><path d="M30 44 L44 18 C50 16 54 20 52 28 L49 40 H72 C78 40 81 46 79 51 L72 74 C70 79 66 81 62 81 H30 Z" fill="#16131F"/><rect x="14" y="44" width="12" height="37" rx="4" fill="#16131F"/></svg><div class="e">OK</div></div>
    <div class="card on"><svg viewBox="0 0 96 96"><path d="M48 86 L14 22 C34 10 62 10 82 22 Z" fill="#16131F"/><path d="M48 86 L20 32 C38 24 58 24 76 32 Z" fill="#DCFF4A"/><circle cx="40" cy="42" r="6" fill="#16131F"/><circle cx="57" cy="48" r="5" fill="#16131F"/><circle cx="48" cy="62" r="5" fill="#16131F"/></svg><div class="e">pizza</div></div>
    <div class="card dim"><svg viewBox="0 0 96 96"><rect x="22" y="22" width="52" height="64" rx="4" fill="none" stroke="#FAF7F0" stroke-width="5"/><rect x="30" y="8" width="36" height="14" rx="3" fill="#FAF7F0"/><g fill="#FAF7F0"><rect x="32" y="34" width="10" height="9"/><rect x="54" y="34" width="10" height="9"/><rect x="32" y="52" width="10" height="9"/><rect x="54" y="52" width="10" height="9"/><rect x="42" y="70" width="12" height="16"/></g></svg><div class="e">hotel</div></div>
  </div>
  <div class="c" id="k-lab">tudo isso é <span>inglês</span></div>
</div>

<div class="layer type" id="F2">
  <div class="blobs"><i style="width:520px;height:520px;background:#FF4F8B;right:-60px;top:-60px;opacity:.6"></i><i style="width:460px;height:460px;background:#6B4BFF;left:-80px;bottom:-80px"></i><i style="width:300px;height:300px;background:#DCFF4A;left:380px;top:-140px;opacity:.4"></i></div>
  <canvas class="grain" width="640" height="360"></canvas>
  <div id="h-row">
    <div class="wd"><div class="e"><b>h<svg viewBox="0 0 80 90"><g fill="none" stroke="#DCFF4A" stroke-width="6" stroke-linecap="round"><path d="M70 18 C52 22 40 18 24 10"/><path d="M70 45 C50 45 34 45 10 45"/><path d="M70 72 C52 68 40 72 24 80"/></g></svg></b>i</div><div class="p">oi</div></div>
    <div class="wd"><div class="e"><b>h<svg viewBox="0 0 80 90"><g fill="none" stroke="#DCFF4A" stroke-width="6" stroke-linecap="round"><path d="M70 18 C52 22 40 18 24 10"/><path d="M70 45 C50 45 34 45 10 45"/><path d="M70 72 C52 68 40 72 24 80"/></g></svg></b>ello</div><div class="p">olá</div></div>
  </div>
  <div class="c" id="h-tip"><div class="t1">o <span>h</span> do começo é um sopro leve</div></div>
  <div class="c" id="h-tip2">em português o h é mudo; <strong>em inglês, não</strong></div>
</div>

<div class="layer" id="F3">
  <img class="img" src="../../../docs/content/aula-motion/novice-01/cenas/igor-camera.jpg" style="transform: translate(-128px,-30px) scale(1.1)">
  <div class="sun"></div><div class="vig"></div>
  <div id="turn">Sua vez!</div>
  <div id="q"><div class="h">O Igor acena para você. O que você diz?</div>
    <div class="opts"><div class="o">Hi!</div><div class="o">Pizza!</div><div class="o">Hotel!</div></div></div>
</div>

<div id="narr"><div class="av"><img src="../../../apps/mobile/assets/charlotte-bust.png"></div><div><div class="n">Charlotte</div><div class="s">sua tutora</div></div></div>
<img id="logo" src="../../../branding/logo/queizy-logo-branco.svg">
<script>
  document.querySelectorAll(".grain").forEach((cv, n) => {
    const c = cv.getContext("2d"), im = c.createImageData(640, 360); let s = 49297 + n * 7;
    for (let i = 0; i < im.data.length; i += 4) { s = (s * 9301 + 49297) % 233280; const v = (s / 233280) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    c.putImageData(im, 0, 0);
  });
  const f = location.hash.slice(1) || "1";
  document.getElementById("F" + f).style.display = "block";
</script>
</body></html>
